<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bot-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
  </defs>
  <!-- Background Disc -->
  <circle cx="50" cy="50" r="48" fill="#111827" stroke="#00E5FF" stroke-width="3"/>
  <!-- Bot Antenna -->
  <line x1="50" y1="12" x2="50" y2="26" stroke="#00E5FF" stroke-width="3"/>
  <circle cx="50" cy="10" r="5" fill="#EF4444"/>
  <!-- Robot CRT Head -->
  <rect x="22" y="26" width="56" height="50" rx="8" fill="url(#bot-grad)" stroke="#38BDF8" stroke-width="2"/>
  <!-- Inner CRT Screen -->
  <rect x="28" y="32" width="44" height="38" rx="4" fill="#080C14"/>
  <!-- Glitch Digital Eyes -->
  <rect x="34" y="42" width="8" height="12" rx="1" fill="#00E5FF"/>
  <!-- Glitched Offset Eye -->
  <rect x="58" y="45" width="10" height="8" rx="1" fill="#F43F5E"/>
  <!-- Mouth Glitch Wave -->
  <polyline points="34,60 40,64 46,58 52,64 58,58 64,62" fill="none" stroke="#10B981" stroke-width="2"/>
  <!-- Head Bolts -->
  <rect x="18" y="44" width="4" height="12" rx="1" fill="#94A3B8"/>
  <rect x="78" y="44" width="4" height="12" rx="1" fill="#94A3B8"/>
</svg>
